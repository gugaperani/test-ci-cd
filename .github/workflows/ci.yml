name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check code formatting
        run: npm run format:check

  test-ios:
    name: iOS Tests
    runs-on: macos-14
    needs: lint
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[test-ios]')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '11'

      - name: Install Appium
        run: npm install -g appium@next

      - name: Install Appium drivers
        run: |
          appium driver install xcuitest
          appium driver list

      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Start Appium server
        run: appium --allow-insecure chromedriver_autodownload &
        env:
          APPIUM_LOG_LEVEL: info

      - name: Wait for Appium
        run: sleep 10

      - name: Run iOS tests
        run: npm run test:ios
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_SECRET_NAME: ${{ secrets.AWS_SECRET_NAME }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          APP_DEEP_LINK_SCHEME: ${{ secrets.APP_DEEP_LINK_SCHEME }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          IOS_PLATFORM_VERSION: ${{ secrets.IOS_PLATFORM_VERSION }}
          IOS_DEVICE_NAME: ${{ secrets.IOS_DEVICE_NAME }}

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ios
          path: allure-results/
          retention-days: 30

      - name: Upload test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-ios
          path: screenshots/
          retention-days: 7

  test-android:
    name: Android Tests
    runs-on: macos-14
    needs: lint
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[test-android]')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '11'

      - name: Install Appium
        run: npm install -g appium@next

      - name: Install Appium drivers
        run: |
          appium driver install uiautomator2
          appium driver list

      - name: Start Appium server
        run: appium --allow-insecure chromedriver_autodownload &
        env:
          APPIUM_LOG_LEVEL: info

      - name: Wait for Appium
        run: sleep 10

      - name: Run Android tests
        run: npm run test:android
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_SECRET_NAME: ${{ secrets.AWS_SECRET_NAME }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          APP_DEEP_LINK_SCHEME: ${{ secrets.APP_DEEP_LINK_SCHEME }}
          ANDROID_PACKAGE: ${{ secrets.ANDROID_PACKAGE }}
          ANDROID_PLATFORM_VERSION: ${{ secrets.ANDROID_PLATFORM_VERSION }}
          ANDROID_DEVICE_NAME: ${{ secrets.ANDROID_DEVICE_NAME }}

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-android
          path: allure-results/
          retention-days: 30

      - name: Upload test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-android
          path: screenshots/
          retention-days: 7

  allure-report:
    name: Generate Allure Report
    runs-on: ubuntu-latest
    needs: [test-ios, test-android]
    if: always() && (needs.test-ios.result == 'success' || needs.test-android.result == 'success' || needs.test-ios.result == 'failure' || needs.test-android.result == 'failure')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download iOS Allure results
        if: needs.test-ios.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          name: allure-results-ios
          path: allure-results/

      - name: Download Android Allure results
        if: needs.test-android.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          name: allure-results-android
          path: allure-results/

      - name: Generate Allure report
        uses: simple-elf/allure-report-action@v1
        with:
          allure_results: allure-results
          allure_report: allure-report
          gh_pages: gh-pages
          allure_history: allure-history

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
